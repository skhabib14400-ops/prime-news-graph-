[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/news/*"
  to = "/.netlify/functions/api/news/:splat"
  status = 200
  conditions = {User-Agent = ["*facebookexternalhit*", "*Facebot*", "*Twitterbot*", "*WhatsApp*", "*TelegramBot*", "*LinkedInBot*"]}

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
