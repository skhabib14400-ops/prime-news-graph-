    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,600&display=swap" rel="stylesheet">

    <!-- Zero-FOUC Instant Theme Initializer -->
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('png_theme');
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (savedTheme === 'dark' || (!savedTheme && systemDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F5F7FA] dark:bg-[#0B132B] text-[#222222] dark:text-[#E2E8F0] font-sans antialiased selection:bg-[#246BFD]/20 selection:text-[#101D35] transition-colors duration-200">

    <script type="module" src="/src/main.tsx"></script>
  </body>
